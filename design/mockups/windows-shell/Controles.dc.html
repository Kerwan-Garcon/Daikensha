<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Panneau Contrôles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#93c5fd}a:hover{color:#bfdbfe}
</style>
</helmet>
<div style="position: relative; width: 1200px; height: 760px; overflow: hidden; background: {{p.desk}}; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;">
  <div style="position: absolute; left: 160px; top: 0; width: 880px; box-sizing: border-box; padding: 14px 20px 14px; display: flex; flex-direction: column; gap: 16px; background: {{p.glass}}; backdrop-filter: blur(28px) saturate(1.4); border: 1px solid {{p.line}}; border-top: none; border-radius: 0 0 30px 30px; box-shadow: 0 30px 70px rgba(0,0,0,0.38); color: {{p.ink}};">

    <div style="display: flex; align-items: center; gap: 12px; height: 40px;">
      <svg width="40" height="31" viewBox="0 0 44 34" aria-hidden="true"><defs><linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf7f2"></stop><stop offset="1" stop-color="{{accent}}"></stop></linearGradient></defs><rect x="2" y="3" width="40" height="29" rx="13" fill="url(#m1)"></rect><circle cx="17" cy="19" r="2.6" fill="#111"></circle><circle cx="29" cy="19" r="2.6" fill="#111"></circle><ellipse cx="10" cy="22" rx="3" ry="1.6" fill="#f9a8b8" opacity="0.7"></ellipse><ellipse cx="34" cy="22" rx="3" ry="1.6" fill="#f9a8b8" opacity="0.7"></ellipse></svg>
      <nav aria-label="Onglets" style="display: flex; gap: 4px;">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="8">
          <button aria-label="{{t.label}}" style="{{t.style}}">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 600;">{{t.label}}</span></sc-if>
          </button>
        </sc-for>
      </nav>
      <div style="flex-grow: 1;"></div>
      <span style="font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 15px;">14:32</span>
      <span style="font-size: 13px; color: {{p.dim}};">sam. 18 oct.</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="grid-column: span 2; padding: 16px; border-radius: 20px; background: {{p.card}}; border: 1px solid {{p.line}}; display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 15px; font-weight: 600;">Son</span>
          <span style="font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 15px; color: {{p.dim}};">62 %</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <button aria-label="Couper le son" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{p.line}}; background: {{p.chip}}; color: {{p.ink}}; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
          <label style="flex-grow: 1; display: flex;"><span style="position: absolute; left: -9999px;">Volume</span><input type="range" min="0" max="100" value="62" style="width: 100%; accent-color: {{accent}};"></label>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: {{p.dim}};">
          <span>Sortie : Casque (Realtek Audio)</span>
          <a href="#">Choisir la sortie dans les Paramètres</a>
        </div>
      </div>

      <div style="padding: 16px; border-radius: 20px; background: {{p.card}}; border: 1px solid {{p.line}}; display: flex; flex-direction: column; gap: 12px;">
        <span style="font-size: 15px; font-weight: 600;">Thème</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: {{p.chip}};">
          <button aria-pressed="{{darkOn}}" style="{{darkBtn}}">Sombre</button>
          <button aria-pressed="{{lightOn}}" style="{{lightBtn}}">Clair</button>
        </div>
        <a href="#" style="font-size: 13px;">Éclairage nocturne dans les Paramètres</a>
      </div>

      <div style="padding: 16px; border-radius: 20px; background: {{p.card}}; border: 1px solid {{p.line}}; display: flex; align-items: center; gap: 12px;">
        <div style="width: 44px; height: 44px; border-radius: 14px; background: {{accentSoft}}; color: {{accent}}; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 9a15 15 0 0 1 20 0M12 20h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">Wi-Fi</span>
          <span style="font-size: 13px; color: {{p.dim}};">Livebox-4A2C</span>
        </div>
        <button aria-label="Wi-Fi" aria-pressed="true" style="width: 48px; height: 28px; border-radius: 14px; border: none; background: {{accent}}; position: relative;"><span style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff;"></span></button>
      </div>

      <div style="padding: 16px; border-radius: 20px; background: {{p.card}}; border: 1px solid {{p.line}}; display: flex; align-items: center; gap: 12px;">
        <div style="width: 44px; height: 44px; border-radius: 14px; background: {{accentSoft}}; color: {{accent}}; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">Bluetooth</span>
          <span style="font-size: 13px; color: {{p.dim}};">2 appareils</span>
        </div>
        <button aria-label="Bluetooth" aria-pressed="true" style="width: 48px; height: 28px; border-radius: 14px; border: none; background: {{accent}}; position: relative;"><span style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff;"></span></button>
      </div>

      <div style="padding: 16px; border-radius: 20px; background: {{p.card}}; border: 1px solid {{p.line}}; display: flex; align-items: center; gap: 12px;">
        <div style="width: 44px; height: 44px; border-radius: 14px; background: {{p.chip}}; color: {{p.dim}}; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">Mode avion</span>
          <span style="font-size: 13px; color: {{p.dim}};">Désactivé</span>
        </div>
        <button aria-label="Mode avion" aria-pressed="false" style="width: 48px; height: 28px; border-radius: 14px; border: none; background: {{p.track}}; position: relative;"><span style="position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff;"></span></button>
      </div>

      <div style="grid-column: span 3; padding: 16px; border-radius: 20px; background: {{p.card}}; border: 1px solid {{p.line}}; display: flex; flex-direction: column; gap: 12px;">
        <span style="font-size: 15px; font-weight: 600;">Luminosité</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;">
          <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: {{p.dim}};"><span style="display: flex; justify-content: space-between;"><span>DELL U2723QE</span><span style="font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums;">70 %</span></span><input type="range" min="0" max="100" value="70" style="width: 100%; accent-color: {{accent}};"></label>
          <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: {{p.dim}};"><span style="display: flex; justify-content: space-between;"><span>Écran intégré</span><span style="font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums;">55 %</span></span><input type="range" min="0" max="100" value="55" style="width: 100%; accent-color: {{accent}};"></label>
        </div>
      </div>
    </div>

    <div style="display: flex; justify-content: center;"><span style="width: 44px; height: 4px; border-radius: 2px; background: {{p.track}};"></span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sombre","clair"],"default":"sombre"},"accent":{"editor":"color","default":"#60a5fa","options":["#60a5fa","#f472b6","#34d399","#f5a524"]},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const light = (this.props.theme ?? 'sombre') === 'clair';
    const accent = this.props.accent ?? '#60a5fa';
    const n = parseInt(accent.slice(1), 16);
    const rgb = ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
    const p = light
      ? { desk: 'radial-gradient(120% 90% at 20% 10%, #e8eef6 0%, #d6dde8 50%, #cfd3dc 100%)', glass: 'rgba(250,250,252,0.80)', card: 'rgba(255,255,255,0.70)', ink: '#15171b', dim: '#555b65', line: 'rgba(0,0,0,0.08)', track: 'rgba(0,0,0,0.12)', chip: 'rgba(0,0,0,0.05)' }
      : { desk: 'radial-gradient(120% 90% at 20% 10%, #2b3550 0%, #1a1f2e 45%, #141418 100%)', glass: 'rgba(10,11,13,0.74)', card: 'rgba(255,255,255,0.045)', ink: '#f5f6f8', dim: '#9398a1', line: 'rgba(255,255,255,0.08)', track: 'rgba(255,255,255,0.14)', chip: 'rgba(255,255,255,0.06)' };
    const icons = [
      ['Contrôles', 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6'],
      ["Aujourd'hui", 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'],
      ['Stats', 'M22 12h-4l-3 9L9 3l-3 9H2'],
      ['Presse-papiers', 'M9 2h6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2'],
      ['Apps', 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z'],
      ['Fonds', 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM21 15l-5-5L5 21M8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z'],
      ['Alimentation', 'M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0'],
      ['Fenêtres', 'M3 3h18v18H3zM12 3v18M12 12h9']
    ];
    const active = 0;
    const tabs = icons.map((ic, i) => ({
      label: ic[0],
      d: ic[1],
      on: i === active,
      style: 'height: 32px; padding: 0 ' + (i === active ? '12px 0 10px' : '8px') + '; border-radius: 16px; border: none; display: flex; align-items: center; gap: 6px; '
        + (i === active ? 'background: rgba(' + rgb + ',0.22); color: ' + accent + ';' : 'background: transparent; color: ' + p.dim + ';')
    }));
    const seg = (on) => 'height: 36px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; '
      + (on ? 'background: ' + (light ? '#ffffff' : 'rgba(255,255,255,0.14)') + '; color: ' + p.ink + ';' : 'background: transparent; color: ' + p.dim + ';');
    return {
      p: p,
      accent: accent,
      accentSoft: 'rgba(' + rgb + ',0.18)',
      tabs: tabs,
      darkOn: light ? 'false' : 'true',
      lightOn: light ? 'true' : 'false',
      darkBtn: seg(!light),
      lightBtn: seg(light)
    };
  }
}
</script>
</body>
</html>
