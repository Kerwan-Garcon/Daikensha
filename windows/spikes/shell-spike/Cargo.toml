# Phase 0 of « Coucou Shell » (docs/WINDOWS_SHELL.md): a read-only probe of the
# Windows APIs the panels and voice tools would use, and the CPU cost of the
# Stats panel's sampling. It changes nothing on the machine. Not part of the
# app's workspace; only the `windows` crate Coucou already depends on.
[package]
name = "shell-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
